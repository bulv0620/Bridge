<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Bridge</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
      }

      .loading {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        background-color: #eee;
        color: #333;
      }

      .wave-effect {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .wave-effect::before,
      .wave-effect::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #dcdfe6;
        transform: scale(0.9);
        animation: wave 2.2s infinite ease-in-out;
      }

      .wave-effect::after {
        animation-delay: 1.1s;
        opacity: 0.2;
      }

      .loading-img {
        position: relative;
        z-index: 1;
      }

      @keyframes wave {
        0% {
          transform: scale(0.9);
          opacity: 0.2;
        }
        30% {
          opacity: 0.5;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @media (prefers-color-scheme: dark) {
        .loading {
          background-color: #18181c;
          color: #eee;
        }

        .wave-effect::before,
        .wave-effect::after {
          background: #3a3a40;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="loading">
        <div class="wave-effect">
          <img
            class="loading-img"
            src="/src/assets/icon.png"
            width="100"
            height="100"
            alt="loading"
          />
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
