name: Build & Release on Tag

on:
  push:
    tags:
      - 'v*'   # 匹配 v1.0.0

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            arch: x64
            build_script: build:mac
          - os: macos-latest
            arch: arm64
            build_script: build:mac

          # Linux
          - os: ubuntu-latest
            arch: x64
            build_script: build:linux
          - os: ubuntu-latest
            arch: arm64
            build_script: build:linux

          # Windows
          - os: windows-latest
            arch: x64
            build_script: build:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # macOS / Linux 构建
      - name: Build & Publish (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "Building target: ${{ matrix.os }} / ${{ matrix.arch }}"

          # electron-builder 支持 --arm64 --x64
          npm run ${{ matrix.build_script }} -- \
            --${{ matrix.arch }} \
            --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # Windows 构建
      - name: Build & Publish (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "Building target: ${{ matrix.os }} / ${{ matrix.arch }}"
          npm run ${{ matrix.build_script }} -- --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
